name: Deploy application containers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-app-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      RESOURCE_GROUP: rg-frontier-boardroom-${{ inputs.environment }}
      BACKEND_APP: app-frontier-${{ inputs.environment }}-backend
      FRONTEND_APP: app-frontier-${{ inputs.environment }}-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].loginServer' \
            --output tsv)"
          if [[ -z "$login_server" ]]; then
            echo "No container registry found in $RESOURCE_GROUP" >&2
            exit 1
          fi
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"
          echo "registry_name=${login_server%%.*}" >> "$GITHUB_OUTPUT"
          echo "backend_url=https://${BACKEND_APP}.azurewebsites.net" >> "$GITHUB_OUTPUT"

      - name: Build immutable images in ACR
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          REGISTRY_NAME: ${{ steps.targets.outputs.registry_name }}
          BACKEND_URL: ${{ steps.targets.outputs.backend_url }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-backend:${GITHUB_SHA}" \
            backend
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-frontend:${GITHUB_SHA}" \
            --build-arg "VITE_API_BASE=${BACKEND_URL}" \
            --build-arg "VITE_WS_BASE=${BACKEND_URL/https:/wss:}" \
            frontend

      - name: Apply public-demo safety settings
        shell: bash
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --settings \
              PUBLIC_DEMO_LIMITS_ENABLED=true \
              PUBLIC_SESSIONS_PER_CLIENT_HOUR=10 \
              PUBLIC_SESSIONS_GLOBAL_HOUR=100 \
              PUBLIC_DEBATES_PER_CLIENT_HOUR=3 \
              PUBLIC_DEBATES_GLOBAL_HOUR=20 \
              PUBLIC_PREP_TURNS_PER_CLIENT_HOUR=12 \
              PUBLIC_PREP_TURNS_GLOBAL_HOUR=60 \
              PUBLIC_ACTIVE_RUNS_PER_CLIENT=1 \
              PUBLIC_ACTIVE_RUNS_GLOBAL=2 \
              TRUST_FORWARDED_CLIENT_IP=false \
            --output none

      - name: Pin and restart applications
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
        run: |
          set -euo pipefail
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --container-image-name "${LOGIN_SERVER}/frontier-backend:${GITHUB_SHA}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --container-image-name "${LOGIN_SERVER}/frontier-frontend:${GITHUB_SHA}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_APP"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP"

      - name: Verify production safety behavior
        shell: bash
        env:
          BACKEND_URL: ${{ steps.targets.outputs.backend_url }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if health="$(curl --fail --silent --show-error "${BACKEND_URL}/health")"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "Backend did not become healthy" >&2
              exit 1
            fi
            sleep 10
          done
          python -c \
            'import json,sys; assert json.loads(sys.argv[1]) == {"status": "ok"}' \
            "$health"

          probe_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${BACKEND_URL}/dev/router-probe")"
          if [[ "$probe_status" != 401 && "$probe_status" != 404 ]]; then
            echo "Router probe is public (HTTP $probe_status)" >&2
            exit 1
          fi

          swap_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"model_ref":"foundry:gpt-5"}' \
            "${BACKEND_URL}/api/v1/agent/CEO/swap-model")"
          if [[ "$swap_status" != 401 && "$swap_status" != 404 ]]; then
            echo "Model swap is public (HTTP $swap_status)" >&2
            exit 1
          fi
