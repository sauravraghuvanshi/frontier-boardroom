name: Deploy application containers

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-app-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
      RESOURCE_GROUP: rg-frontier-boardroom-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
      BACKEND_APP: app-frontier-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}-backend
      FRONTEND_APP: app-frontier-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}-frontend
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Reject stale automatic releases
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_master="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/master" \
            --jq '.sha')"
          if [[ "$DEPLOY_SHA" != "$current_master" ]]; then
            echo "Refusing stale deployment: $DEPLOY_SHA is not current master" >&2
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].loginServer' \
            --output tsv)"
          if [[ -z "$login_server" ]]; then
            echo "No container registry found in $RESOURCE_GROUP" >&2
            exit 1
          fi
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"
          echo "registry_name=${login_server%%.*}" >> "$GITHUB_OUTPUT"
          echo "backend_url=https://${BACKEND_APP}.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${FRONTEND_APP}.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "backend_id=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query 'id' \
            --output tsv)" >> "$GITHUB_OUTPUT"
          echo "frontend_id=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query 'id' \
            --output tsv)" >> "$GITHUB_OUTPUT"
          app_service_plan_id="$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query 'serverFarmId' \
            --output tsv)"
          if [[ -z "$app_service_plan_id" ]]; then
            echo "No App Service plan found for $BACKEND_APP" >&2
            exit 1
          fi
          echo "app_service_plan_id=$app_service_plan_id" >> "$GITHUB_OUTPUT"

      - name: Build immutable images in ACR
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          REGISTRY_NAME: ${{ steps.targets.outputs.registry_name }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-backend:${DEPLOY_SHA}" \
            --build-arg "APP_BUILD_SHA=${DEPLOY_SHA}" \
            backend
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-frontend:${DEPLOY_SHA}" \
            --build-arg "APP_BUILD_SHA=${DEPLOY_SHA}" \
            --build-arg "VITE_API_BASE=${FRONTEND_URL}" \
            --build-arg "VITE_WS_BASE=${FRONTEND_URL/https:/wss:}" \
            --build-arg "VITE_ENTRA_AUTH_ENABLED=true" \
            frontend

      - name: Recheck current master before deployment
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_master="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/master" \
            --jq '.sha')"
          if [[ "$DEPLOY_SHA" != "$current_master" ]]; then
            echo "Master advanced during build; refusing stale deployment" >&2
            exit 1
          fi

      - name: Validate App Service plan
        shell: bash
        env:
          APP_SERVICE_PLAN_ID: ${{ steps.targets.outputs.app_service_plan_id }}
        run: |
          set -euo pipefail
          current_sku="$(az appservice plan show \
            --ids "$APP_SERVICE_PLAN_ID" \
            --query 'sku.name' \
            --output tsv)"
          if [[ "$current_sku" != "S1" ]]; then
            echo "App Service plan drifted: expected S1, got $current_sku; run the Bicep deployment before releasing images" >&2
            exit 1
          fi

      - name: Validate public-demo safety settings
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected_settings=(
            [PUBLIC_DEMO_LIMITS_ENABLED]=true
            [PUBLIC_SESSIONS_PER_CLIENT_HOUR]=10
            [PUBLIC_SESSIONS_GLOBAL_HOUR]=100
            [PUBLIC_DEBATES_PER_CLIENT_HOUR]=3
            [PUBLIC_DEBATES_GLOBAL_HOUR]=20
            [PUBLIC_PREP_TURNS_PER_CLIENT_HOUR]=12
            [PUBLIC_PREP_TURNS_GLOBAL_HOUR]=60
            [PUBLIC_ACTIVE_RUNS_PER_CLIENT]=1
            [PUBLIC_ACTIVE_RUNS_GLOBAL]=2
            [TRUST_FORWARDED_CLIENT_IP]=false
          )
          declare -A current_settings=()
          while IFS=$'\t' read -r name value; do
            if [[ -n "${expected_settings[$name]+x}" ]]; then
              current_settings["$name"]="$value"
            fi
          done < <(az webapp config appsettings list \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query '[].[name,value]' \
            --output tsv)

          settings_changed=false
          for name in "${!expected_settings[@]}"; do
            if [[ "${current_settings[$name]-}" != "${expected_settings[$name]}" ]]; then
              settings_changed=true
              break
            fi
          done

          if [[ "$settings_changed" == "true" ]]; then
            echo "Public-demo safety settings drifted; run the Bicep deployment before releasing images" >&2
            exit 1
          fi
          echo "Public-demo safety settings match"

      - name: Pin application images
        id: pin
        shell: bash
        env:
          BACKEND_APP_ID: ${{ steps.targets.outputs.backend_id }}
          FRONTEND_APP_ID: ${{ steps.targets.outputs.frontend_id }}
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
        run: |
          set -euo pipefail

          backend_previous_image="$(az webapp config show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query 'linuxFxVersion' \
            --output tsv)"
          frontend_previous_image="$(az webapp config show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query 'linuxFxVersion' \
            --output tsv)"

          validate_registry_config() {
            local app="$1"
            local current_image="$2"
            managed_identity="$(az webapp config show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$app" \
              --query 'acrUseManagedIdentityCreds' \
              --output tsv)"
            if [[ "$managed_identity" != "true" || "$current_image" != "DOCKER|${LOGIN_SERVER}/"* ]]; then
              echo "Container registry configuration drift detected for $app" >&2
              exit 1
            fi
          }
          validate_registry_config "$BACKEND_APP" "$backend_previous_image"
          validate_registry_config "$FRONTEND_APP" "$frontend_previous_image"

          validate_pinned_config() {
            local app_id="$1"
            local expected_image="$2"
            local config
            config="$(az resource show \
              --ids "${app_id}/config/web" \
              --api-version 2023-12-01 \
              --query 'properties.{image:linuxFxVersion, managedIdentity:acrUseManagedIdentityCreds, routeAll:vnetRouteAllEnabled, alwaysOn:alwaysOn}' \
              --output json)"
            if ! python -c \
              'import json,sys; config=json.loads(sys.argv[1]); sys.exit(0 if config == {"image": sys.argv[2], "managedIdentity": True, "routeAll": True, "alwaysOn": True} else 1)' \
              "$config" "$expected_image"; then
              echo "Critical App Service configuration changed while pinning $app_id" >&2
              exit 1
            fi
          }

          printf 'previous_backend_image=%s\n' "$backend_previous_image" >> "$GITHUB_OUTPUT"
          printf 'previous_frontend_image=%s\n' "$frontend_previous_image" >> "$GITHUB_OUTPUT"
          previous_headers="$(mktemp)"
          trap 'rm -f "$previous_headers"' EXIT
          if ! previous_health="$(curl --fail --silent --show-error --max-time 15 \
            --dump-header "$previous_headers" "${FRONTEND_URL}/health")"; then
            echo "Current production pair is not healthy; refusing to start a release" >&2
            exit 1
          fi
          previous_backend_build_sha="$(python -c \
            'import json,sys; print(json.loads(sys.argv[1]).get("build_sha", ""))' \
            "$previous_health")"
          previous_frontend_build_sha="$(awk '
            tolower($1) == "x-frontier-build-sha:" {
              gsub("\r", "", $2)
              value = $2
            }
            END { print value }
          ' "$previous_headers")"
          printf 'previous_backend_build_sha=%s\n' "$previous_backend_build_sha" >> "$GITHUB_OUTPUT"
          printf 'previous_frontend_build_sha=%s\n' "$previous_frontend_build_sha" >> "$GITHUB_OUTPUT"

          backend_image="DOCKER|${LOGIN_SERVER}/frontier-backend:${DEPLOY_SHA}"
          echo "mutation_started=true" >> "$GITHUB_OUTPUT"
          az resource update \
            --ids "${BACKEND_APP_ID}/config/web" \
            --api-version 2023-12-01 \
            --set "properties.linuxFxVersion=${backend_image}" \
            --output none
          validate_pinned_config "$BACKEND_APP_ID" "$backend_image"

          backend_deadline=$((SECONDS + 300))
          backend_ready=false
          while (( SECONDS < backend_deadline )); do
            if health="$(curl --fail --silent --show-error --max-time 15 "${FRONTEND_URL}/health")" &&
              python -c \
                'import json,sys; payload=json.loads(sys.argv[1]); sys.exit(0 if payload.get("status") == "ok" and payload.get("build_sha") == sys.argv[2] else 1)' \
                "$health" "$DEPLOY_SHA"; then
              backend_ready=true
              break
            fi
            sleep 10
          done
          if [[ "$backend_ready" != "true" ]]; then
            echo "Backend readiness was not observable through the old frontend; continuing so the frontend can rebind" >&2
          fi

          frontend_image="DOCKER|${LOGIN_SERVER}/frontier-frontend:${DEPLOY_SHA}"
          echo "frontend_mutation_started=true" >> "$GITHUB_OUTPUT"
          az resource update \
            --ids "${FRONTEND_APP_ID}/config/web" \
            --api-version 2023-12-01 \
            --set "properties.linuxFxVersion=${frontend_image}" \
            --output none

          validate_pinned_config "$FRONTEND_APP_ID" "$frontend_image"

      - name: Verify production safety behavior
        shell: bash
        env:
          BACKEND_URL: ${{ steps.targets.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
        run: |
          set -euo pipefail
          auth_enabled="$(az webapp auth show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query 'platform.enabled' \
            --output tsv)"
          health_url="${FRONTEND_URL}/health"
          if [[ "$auth_enabled" == "true" ]]; then
            protected_url="$FRONTEND_URL"
          else
            protected_url="$BACKEND_URL"
          fi

          health_started=$SECONDS
          health_deadline=$((health_started + 900))
          health_headers="$(mktemp)"
          trap 'rm -f "$health_headers"' EXIT
          while true; do
            if health="$(curl --fail --silent --show-error --max-time 15 \
              --dump-header "$health_headers" "$health_url")"; then
              frontend_build_sha="$(awk '
                tolower($1) == "x-frontier-build-sha:" {
                  gsub("\r", "", $2)
                  value = $2
                }
                END { print value }
              ' "$health_headers")"
              if python -c \
                'import json,sys; payload=json.loads(sys.argv[1]); sys.exit(0 if payload.get("status") == "ok" and payload.get("build_sha") == sys.argv[2] and sys.argv[3] == sys.argv[2] else 1)' \
                "$health" "$DEPLOY_SHA" "$frontend_build_sha"; then
                break
              fi
            fi
            if (( SECONDS >= health_deadline )); then
              echo "Application did not become healthy within 15 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Application became healthy after $((SECONDS - health_started)) seconds"

          if [[ "$auth_enabled" == "true" ]]; then
            frontend_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${FRONTEND_URL}/")"
            if [[ "$frontend_status" != 302 && "$frontend_status" != 401 ]]; then
              echo "Frontend did not require Entra sign-in (HTTP $frontend_status)" >&2
              exit 1
            fi

            backend_public_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${BACKEND_URL}/health")"
            if [[ "$backend_public_status" != 403 && "$backend_public_status" != 404 ]]; then
              echo "Backend remained publicly reachable (HTTP $backend_public_status)" >&2
              exit 1
            fi
          fi

          probe_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${protected_url}/dev/router-probe")"
          if [[ "$probe_status" != 302 && "$probe_status" != 401 &&
            "$probe_status" != 403 && "$probe_status" != 404 ]]; then
            echo "Router probe is public (HTTP $probe_status)" >&2
            exit 1
          fi

          swap_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"model_ref":"foundry:gpt-5"}' \
            "${protected_url}/api/v1/agent/CEO/swap-model")"
          if [[ "$swap_status" != 302 && "$swap_status" != 401 &&
            "$swap_status" != 403 && "$swap_status" != 404 ]]; then
            echo "Model swap is public (HTTP $swap_status)" >&2
            exit 1
          fi

      - name: Roll back failed release
        if: ${{ (failure() || cancelled()) && steps.pin.outputs.mutation_started == 'true' }}
        shell: bash
        env:
          BACKEND_APP_ID: ${{ steps.targets.outputs.backend_id }}
          FRONTEND_APP_ID: ${{ steps.targets.outputs.frontend_id }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
          PREVIOUS_BACKEND_IMAGE: ${{ steps.pin.outputs.previous_backend_image }}
          PREVIOUS_BACKEND_BUILD_SHA: ${{ steps.pin.outputs.previous_backend_build_sha }}
          PREVIOUS_FRONTEND_IMAGE: ${{ steps.pin.outputs.previous_frontend_image }}
          PREVIOUS_FRONTEND_BUILD_SHA: ${{ steps.pin.outputs.previous_frontend_build_sha }}
          FRONTEND_MUTATION_STARTED: ${{ steps.pin.outputs.frontend_mutation_started }}
          REJECTED_BUILD_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          echo "Restoring previous application images"
          az resource update \
            --ids "${BACKEND_APP_ID}/config/web" \
            --api-version 2023-12-01 \
            --set "properties.linuxFxVersion=${PREVIOUS_BACKEND_IMAGE}" \
            --output none
          if [[ "$FRONTEND_MUTATION_STARTED" == "true" ]]; then
            az resource update \
              --ids "${FRONTEND_APP_ID}/config/web" \
              --api-version 2023-12-01 \
              --set "properties.linuxFxVersion=${PREVIOUS_FRONTEND_IMAGE}" \
              --output none
          fi

          actual_backend_image="$(az resource show \
            --ids "${BACKEND_APP_ID}/config/web" \
            --api-version 2023-12-01 \
            --query 'properties.linuxFxVersion' \
            --output tsv)"
          actual_frontend_image="$(az resource show \
            --ids "${FRONTEND_APP_ID}/config/web" \
            --api-version 2023-12-01 \
            --query 'properties.linuxFxVersion' \
            --output tsv)"
          if [[ "$actual_backend_image" != "$PREVIOUS_BACKEND_IMAGE" ||
            "$actual_frontend_image" != "$PREVIOUS_FRONTEND_IMAGE" ]]; then
            echo "Rollback image references did not restore correctly" >&2
            exit 1
          fi

          rollback_deadline=$((SECONDS + 900))
          rollback_headers="$(mktemp)"
          trap 'rm -f "$rollback_headers"' EXIT
          while true; do
            if health="$(curl --fail --silent --show-error --max-time 15 \
              --dump-header "$rollback_headers" "${FRONTEND_URL}/health")"; then
              frontend_build_sha="$(awk '
                tolower($1) == "x-frontier-build-sha:" {
                  gsub("\r", "", $2)
                  value = $2
                }
                END { print value }
              ' "$rollback_headers")"
              if python -c \
                'import json,sys; payload=json.loads(sys.argv[1]); backend_ok=payload.get("build_sha") == sys.argv[2] if sys.argv[2] else payload.get("build_sha") != sys.argv[4]; frontend_ok=sys.argv[3] == sys.argv[5] if sys.argv[3] else sys.argv[5] != sys.argv[4]; sys.exit(0 if payload.get("status") == "ok" and backend_ok and frontend_ok else 1)' \
                "$health" "$PREVIOUS_BACKEND_BUILD_SHA" "$PREVIOUS_FRONTEND_BUILD_SHA" \
                "$REJECTED_BUILD_SHA" "$frontend_build_sha"; then
                echo "Previous application images restored"
                break
              fi
            fi
            if (( SECONDS >= rollback_deadline )); then
              echo "Rollback did not become healthy within 15 minutes" >&2
              exit 1
            fi
            sleep 10
          done
