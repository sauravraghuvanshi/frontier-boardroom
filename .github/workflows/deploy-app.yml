name: Deploy application containers

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: deploy-app-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
    env:
      ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
      RESOURCE_GROUP: rg-frontier-boardroom-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}
      BACKEND_APP: app-frontier-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}-backend
      FRONTEND_APP: app-frontier-${{ github.event_name == 'workflow_run' && 'prod' || inputs.environment }}-frontend
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Reject stale automatic releases
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_master="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/master" \
            --jq '.sha')"
          if [[ "$DEPLOY_SHA" != "$current_master" ]]; then
            echo "Refusing stale deployment: $DEPLOY_SHA is not current master" >&2
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployment targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr list \
            --resource-group "$RESOURCE_GROUP" \
            --query '[0].loginServer' \
            --output tsv)"
          if [[ -z "$login_server" ]]; then
            echo "No container registry found in $RESOURCE_GROUP" >&2
            exit 1
          fi
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"
          echo "registry_name=${login_server%%.*}" >> "$GITHUB_OUTPUT"
          echo "backend_url=https://${BACKEND_APP}.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${FRONTEND_APP}.azurewebsites.net" >> "$GITHUB_OUTPUT"

      - name: Build immutable images in ACR
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
          REGISTRY_NAME: ${{ steps.targets.outputs.registry_name }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
        run: |
          set -euo pipefail
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-backend:${DEPLOY_SHA}" \
            backend
          az acr build \
            --registry "$REGISTRY_NAME" \
            --image "frontier-frontend:${DEPLOY_SHA}" \
            --build-arg "VITE_API_BASE=${FRONTEND_URL}" \
            --build-arg "VITE_WS_BASE=${FRONTEND_URL/https:/wss:}" \
            --build-arg "VITE_ENTRA_AUTH_ENABLED=true" \
            frontend

      - name: Recheck current master before deployment
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_master="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/master" \
            --jq '.sha')"
          if [[ "$DEPLOY_SHA" != "$current_master" ]]; then
            echo "Master advanced during build; refusing stale deployment" >&2
            exit 1
          fi

      - name: Apply public-demo safety settings
        shell: bash
        run: |
          set -euo pipefail
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --settings \
              PUBLIC_DEMO_LIMITS_ENABLED=true \
              PUBLIC_SESSIONS_PER_CLIENT_HOUR=10 \
              PUBLIC_SESSIONS_GLOBAL_HOUR=100 \
              PUBLIC_DEBATES_PER_CLIENT_HOUR=3 \
              PUBLIC_DEBATES_GLOBAL_HOUR=20 \
              PUBLIC_PREP_TURNS_PER_CLIENT_HOUR=12 \
              PUBLIC_PREP_TURNS_GLOBAL_HOUR=60 \
              PUBLIC_ACTIVE_RUNS_PER_CLIENT=1 \
              PUBLIC_ACTIVE_RUNS_GLOBAL=2 \
              TRUST_FORWARDED_CLIENT_IP=false \
            --output none

      - name: Pin and restart applications
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.targets.outputs.login_server }}
        run: |
          set -euo pipefail
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --container-image-name "${LOGIN_SERVER}/frontier-backend:${DEPLOY_SHA}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --container-image-name "${LOGIN_SERVER}/frontier-frontend:${DEPLOY_SHA}" \
            --container-registry-url "https://${LOGIN_SERVER}" \
            --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$BACKEND_APP"
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$FRONTEND_APP"

      - name: Verify production safety behavior
        shell: bash
        env:
          BACKEND_URL: ${{ steps.targets.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.targets.outputs.frontend_url }}
        run: |
          set -euo pipefail
          auth_enabled="$(az webapp auth show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query 'platform.enabled' \
            --output tsv)"
          if [[ "$auth_enabled" == "true" ]]; then
            health_url="${FRONTEND_URL}/health"
            protected_url="$FRONTEND_URL"
          else
            health_url="${BACKEND_URL}/health"
            protected_url="$BACKEND_URL"
          fi

          for attempt in {1..18}; do
            if health="$(curl --fail --silent --show-error "$health_url")"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "Application did not become healthy" >&2
              exit 1
            fi
            sleep 10
          done
          python -c \
            'import json,sys; assert json.loads(sys.argv[1]) == {"status": "ok"}' \
            "$health"

          if [[ "$auth_enabled" == "true" ]]; then
            frontend_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${FRONTEND_URL}/")"
            if [[ "$frontend_status" != 302 ]]; then
              echo "Frontend did not require Entra sign-in (HTTP $frontend_status)" >&2
              exit 1
            fi

            backend_public_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${BACKEND_URL}/health")"
            if [[ "$backend_public_status" != 403 && "$backend_public_status" != 404 ]]; then
              echo "Backend remained publicly reachable (HTTP $backend_public_status)" >&2
              exit 1
            fi
          fi

          probe_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${protected_url}/dev/router-probe")"
          if [[ "$probe_status" != 302 && "$probe_status" != 401 && "$probe_status" != 404 ]]; then
            echo "Router probe is public (HTTP $probe_status)" >&2
            exit 1
          fi

          swap_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"model_ref":"foundry:gpt-5"}' \
            "${protected_url}/api/v1/agent/CEO/swap-model")"
          if [[ "$swap_status" != 302 && "$swap_status" != 401 && "$swap_status" != 404 ]]; then
            echo "Model swap is public (HTTP $swap_status)" >&2
            exit 1
          fi
