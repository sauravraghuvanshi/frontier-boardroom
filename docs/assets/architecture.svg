<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Boardroom architecture</title>
  <desc id="desc">React connects by WebSocket to FastAPI orchestration, which routes models to Foundry and Databricks and retrieves knowledge through Foundry IQ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0l8 4-8 4z" fill="#818cf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1120" height="610" rx="22" fill="url(#bg)"/>
  <text x="560" y="48" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Request-to-decision architecture</text>
  <g fill="none" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)">
